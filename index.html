
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke & Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Joke & Quote Generator</h1>

        <p>Click the button to discover something funny or inspiring!</p>

        <div class="display-box">

            <h2 id="type">Your Joke or Quote</h2>

            <p id="text">
                Click Next to get started!
            </p>

            <p id="author"></p>

        </div>

        <div class="filter-buttons">

            <button id="allBtn">All</button>

            <button id="jokesBtn">Jokes</button>

            <button id="quotesBtn">Quotes</button>

        </div>

        <button id="nextBtn">Next</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
